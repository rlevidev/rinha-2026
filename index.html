# rinha-2026
![Go](https://img.shields.io/badge/Go-1.26-00ADD8?logo=go)
![GOEXPERIMENT](https://img.shields.io/badge/GOEXPERIMENT-simd-blueviolet)
![Ranking](https://img.shields.io/badge/Rinha%202026-30%C2%BA%20lugar-gold)
![Score](https://img.shields.io/badge/Score-5.819,38-brightgreen)

> Fraud detection service with vector search for Rinha de Backend 2026.

## About
Fraud detection service written in Go 1.26 with a SIMD-optimized IVF k-NN vector search engine.
Processes fraud scores for credit card transactions by vectorizing features and performing
approximate nearest neighbor search against a pre-computed dataset of 100k transactions,
designed for the constraints of Rinha de Backend 2026.

## Installation

### Prerequisites
- Go 1.26+ with `GOEXPERIMENT=simd` enabled
- CPU with AVX2 support (required for SIMD kernels)
- Docker (to test production configuration)
- Linux with `CAP_SYS_NICE` and `CAP_IPC_LOCK` capabilities (required for `SCHED_FIFO`
  real-time priority and `mlockall` memory locking outside Docker)
- Make (optional, for convenience commands)

```bash
# Enable Go experiments
export GOEXPERIMENT=simd

# Clone repository
git clone https://github.com/rlevidev/rinha-2026.git
cd rinha-2026

# Download dependencies
go mod download
```

## Usage
```bash
# Build all binaries
make build

# Start development environment (LB + 2 API workers)
make dev-up

# Send a test request to the local service
make test-request

# View service logs
make logs
```

## Environment Variables
| Key          | Default | Description                              |
|--------------|---------|------------------------------------------|
| GOEXPERIMENT | simd    | Enable Go experiments for SIMD support   |

(Note: Runtime configuration is via command-line arguments and mounted volumes, not environment variables.)

### Running tests
```bash
# Run all tests with race detector
go test -race ./...

# Run tests for a specific package
go test -race ./internal/fraud
go test -race ./internal/index
```

### Running benchmarks
```bash
# Run benchmarks

# Run benchmarks with memory allocation profiling
go test -bench=. -benchmem ./...
```

### Development environment
```bash
# Start development environment (LB + 2 API workers)
make dev-up

# Stop development environment
make down
```

    var graphDef = codeEl.textContent.trim();
    try {
      var id = 'mermaid-' + lang + '-' + (mermaidCounter++);
      var result = await mermaid.render(id, graphDef);
      var wrap = document.createElement('div');
      wrap.className = 'mermaid-wrap';
      wrap.innerHTML = result.svg;

      var hint = document.createElement('span');
      hint.className = 'mermaid-hint';
      hint.textContent = t.mermaidHint;
      wrap.appendChild(hint);

      wrap.addEventListener('click', (function(w) {
        return function() { openLightbox(w.querySelector('svg'), lang); };
      })(wrap));

      preEl.replaceWith(wrap);
    } catch (e) {
      console.warn('mermaid block', i, e);
    }
  }
}

/* ── apply i18n strings to the page UI ──────────────────────────────────────── */
function applyUI(lang) {
  var t = I18N[lang];
  document.getElementById('html-root').setAttribute('lang', t.htmlLang);

  /* data-i18n elements */
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });

  /* lang switch buttons */
  document.querySelectorAll('.lang-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}

/* ── switch language ────────────────────────────────────────────────────────── */
async function setLang(lang) {
  if (!(lang in I18N)) return;
  currentLang = lang;
  try { localStorage.setItem('lang', lang); } catch(e) {}
  applyUI(lang);
  await renderReadme(lang);
}

/* ── boot ───────────────────────────────────────────────────────────────────── */
applyUI(currentLang);
renderReadme(currentLang);

/* lang toggle buttons */
document.getElementById('lang-switch').addEventListener('click', function(e) {
  var btn = e.target.closest('.lang-btn');
  if (btn && btn.dataset.lang !== currentLang) setLang(btn.dataset.lang);
});

/* ---- lightbox ---- */
function openLightbox(sourceSvg, lang) {
  let scale = 1, tx = 0, ty = 0;
  let dragging = false, ox = 0, oy = 0;

  const overlay = document.createElement('div');
  overlay.className = 'lb-overlay';

  const toolbar = document.createElement('div');
  toolbar.className = 'lb-toolbar';
  toolbar.innerHTML =
    '<span class="lb-hint">' + I18N[lang || currentLang].lbHint + '</span>' +
    '<div class="lb-btns">' +
      '<button class="lb-btn" id="lb-zin">+</button>' +
      '<button class="lb-btn" id="lb-zout">-</button>' +
      '<button class="lb-btn" id="lb-rst">\u21ba</button>' +
      '<button class="lb-btn" id="lb-cls">\u2715</button>' +
    '</div>';
  overlay.appendChild(toolbar);

  const stage = document.createElement('div');
  stage.className = 'lb-stage';

  const svgClone = sourceSvg.cloneNode(true);

  // Size SVG to fill ~85% of viewport, preserving aspect ratio via viewBox
  var vb = sourceSvg.viewBox.baseVal;
  if (vb && vb.width > 0) {
    var maxW = window.innerWidth  * 0.88;
    var maxH = (window.innerHeight - 56) * 0.88; // 56 = toolbar height
    var ratio = vb.height / vb.width;
    var w = maxW, h = w * ratio;
    if (h > maxH) { h = maxH; w = h / ratio; }
    svgClone.setAttribute('width',  Math.round(w));
    svgClone.setAttribute('height', Math.round(h));
  } else {
    svgClone.style.width  = '85vw';
    svgClone.style.height = 'auto';
  }
  svgClone.style.display = 'block';

  stage.appendChild(svgClone);
  overlay.appendChild(stage);
  document.body.appendChild(overlay);

  function apply() {
    stage.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  }

  overlay.addEventListener('wheel', function(e) {
    e.preventDefault();
    scale = Math.max(0.2, Math.min(8, scale * (e.deltaY < 0 ? 1.12 : 0.89)));
    apply();
  }, { passive: false });

  overlay.addEventListener('mousedown', function(e) {
    if (e.target.closest('.lb-btns')) return;
    dragging = true; ox = e.clientX - tx; oy = e.clientY - ty;
    overlay.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    tx = e.clientX - ox; ty = e.clientY - oy; apply();
  });
  window.addEventListener('mouseup', function() {
    dragging = false; overlay.style.cursor = 'grab';
  });

  let lastTouches = null;
  overlay.addEventListener('touchstart', function(e) { lastTouches = e.touches; }, { passive: true });
  overlay.addEventListener('touchmove', function(e) {
    if (e.touches.length === 1 && lastTouches && lastTouches.length === 1) {
      tx += e.touches[0].clientX - lastTouches[0].clientX;
      ty += e.touches[0].clientY - lastTouches[0].clientY;
    }
    if (e.touches.length === 2 && lastTouches && lastTouches.length === 2) {
      var d0 = Math.hypot(lastTouches[0].clientX - lastTouches[1].clientX, lastTouches[0].clientY - lastTouches[1].clientY);
      var d1 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      scale = Math.max(0.2, Math.min(8, scale * (d1 / d0)));
    }
    lastTouches = e.touches; apply(); e.preventDefault();
  }, { passive: false });

  function close() { document.body.removeChild(overlay); }
  overlay.querySelector('#lb-zin') .addEventListener('click', function() { scale = Math.min(8, scale * 1.25); apply(); });
  overlay.querySelector('#lb-zout').addEventListener('click', function() { scale = Math.max(0.2, scale / 1.25); apply(); });
  overlay.querySelector('#lb-rst') .addEventListener('click', function() { scale = 1; tx = 0; ty = 0; apply(); });
  overlay.querySelector('#lb-cls') .addEventListener('click', close);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); }
  });
}
</script>

<style>
.mermaid-wrap { position: relative; cursor: zoom-in; }
.mermaid-hint {
  position: absolute; bottom: 10px; right: 12px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-faint); pointer-events: none;
  opacity: 0; transition: opacity 0.2s;
}
.mermaid-wrap:hover .mermaid-hint { opacity: 1; }

.lb-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(10,13,18,0.97);
  display: flex; align-items: center; justify-content: center;
  cursor: grab;
  -webkit-user-select: none; user-select: none;
}
.lb-toolbar {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 20px;
  background: rgba(18,21,28,0.9);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  z-index: 1; cursor: default;
}
.lb-hint { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); }
.lb-btns { display: flex; gap: 8px; }
.lb-btn {
  font-family: var(--font-mono); font-size: 15px;
  background: var(--surface); border: 1px solid var(--border-strong);
  color: var(--text-muted); border-radius: 6px;
  padding: 4px 11px; cursor: pointer; line-height: 1.4;
  transition: border-color 0.15s, color 0.15s;
}
.lb-btn:hover { border-color: var(--accent); color: var(--accent); }
.lb-stage { transform-origin: center center; will-change: transform; padding: 48px 24px 24px; }
.lb-stage svg { display: block; }
</style>

</body>
