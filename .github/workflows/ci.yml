name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to get full commit history for short SHA

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA for Docker tag
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update submission branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout submission
          # Create or update docker-compose.yml
          cat << EOF > docker-compose.yml
version: '3.8'
services:
  api1:
    image: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.SHA_SHORT }}
    # Add other service configurations as needed
  api2:
    image: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.SHA_SHORT }}
    # Add other service configurations as needed
  nginx:
    image: nginx:latest
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
EOF
          # Add other necessary files for submission branch
          git add docker-compose.yml # Add other files as they are created
          git commit -m "chore: update docker-compose.yml with image tag ${{ steps.vars.outputs.SHA_SHORT }}"
          git push origin submission
