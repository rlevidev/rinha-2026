name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.SHA_SHORT }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA for Docker tag
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-submission:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout submission branch
        uses: actions/checkout@v4
        with:
          ref: submission
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update docker-compose.yml
        env:
          SHA_SHORT: ${{ needs.build-and-push.outputs.sha_short }}
          REPO: ${{ github.repository }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "x-go: &go" > docker-compose.yml
          echo "  platform: linux/amd64" >> docker-compose.yml
          echo "  restart: unless-stopped" >> docker-compose.yml
          echo "  ulimits:" >> docker-compose.yml
          echo "    memlock: -1" >> docker-compose.yml
          echo "    nofile:" >> docker-compose.yml
          echo "      soft: 65535" >> docker-compose.yml
          echo "      hard: 65535" >> docker-compose.yml
          echo "" >> docker-compose.yml
          echo "services:" >> docker-compose.yml
          echo "  lb:" >> docker-compose.yml
          echo "    <<: *go" >> docker-compose.yml
          echo "    image: ghcr.io/${REPO}:${SHA_SHORT}" >> docker-compose.yml
          echo "    cpuset: \"2,3\"" >> docker-compose.yml
          echo "    command: [\"/lb\", \"9999\", \"/sockets/api1.sock\", \"/sockets/api2.sock\"]" >> docker-compose.yml
          echo "    ports:" >> docker-compose.yml
          echo "      - \"9999:9999\"" >> docker-compose.yml
          echo "    volumes:" >> docker-compose.yml
          echo "      - sockets:/sockets" >> docker-compose.yml
          echo "    depends_on:" >> docker-compose.yml
          echo "      - api1" >> docker-compose.yml
          echo "      - api2" >> docker-compose.yml
          echo "    deploy:" >> docker-compose.yml
          echo "      resources:" >> docker-compose.yml
          echo "        limits:" >> docker-compose.yml
          echo "          cpus: \"0.05\"" >> docker-compose.yml
          echo "          memory: \"8MB\"" >> docker-compose.yml
          echo "" >> docker-compose.yml
          echo "  api1:" >> docker-compose.yml
          echo "    <<: *go" >> docker-compose.yml
          echo "    image: ghcr.io/${REPO}:${SHA_SHORT}" >> docker-compose.yml
          echo "    cpuset: \"0\"" >> docker-compose.yml
          echo "    command: [\"/server\", \"/sockets/api1.sock\", \"/index\"]" >> docker-compose.yml
          echo "    volumes:" >> docker-compose.yml
          echo "      - sockets:/sockets" >> docker-compose.yml
          echo "    deploy:" >> docker-compose.yml
          echo "      resources:" >> docker-compose.yml
          echo "        limits:" >> docker-compose.yml
          echo "          cpus: \"0.475\"" >> docker-compose.yml
          echo "          memory: \"171MB\"" >> docker-compose.yml
          echo "" >> docker-compose.yml
          echo "  api2:" >> docker-compose.yml
          echo "    <<: *go" >> docker-compose.yml
          echo "    image: ghcr.io/${REPO}:${SHA_SHORT}" >> docker-compose.yml
          echo "    cpuset: \"1\"" >> docker-compose.yml
          echo "    command: [\"/server\", \"/sockets/api2.sock\", \"/index\"]" >> docker-compose.yml
          echo "    volumes:" >> docker-compose.yml
          echo "      - sockets:/sockets" >> docker-compose.yml
          echo "    deploy:" >> docker-compose.yml
          echo "      resources:" >> docker-compose.yml
          echo "        limits:" >> docker-compose.yml
          echo "          cpus: \"0.475\"" >> docker-compose.yml
          echo "          memory: \"171MB\"" >> docker-compose.yml
          echo "" >> docker-compose.yml
          echo "volumes:" >> docker-compose.yml
          echo "  sockets:" >> docker-compose.yml
          echo "    driver: local" >> docker-compose.yml
          echo "    driver_opts:" >> docker-compose.yml
          echo "      type: tmpfs" >> docker-compose.yml
          echo "      device: tmpfs" >> docker-compose.yml
          echo "      o: size=4m,mode=0777" >> docker-compose.yml

          if ! git diff --quiet; then
            git add docker-compose.yml
            git commit -m "chore: update docker-compose.yml with image tag ${SHA_SHORT}"
            git push --force-with-lease origin submission
          else
            echo "No changes to commit"
          fi
