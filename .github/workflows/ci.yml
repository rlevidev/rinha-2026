name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.SHA_SHORT }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA for Docker tag
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-submission:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout submission branch
        uses: actions/checkout@v4
        with:
          ref: submission
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update docker-compose.yml
        env:
          SHA_SHORT: ${{ needs.build-and-push.outputs.sha_short }}
          REPO: ${{ github.repository }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          printf "services:\n  api1:\n    image: ghcr.io/${REPO}:${SHA_SHORT}\n    command: [\"/app/server\", \"/sockets/api1.sock\", \"/index\"]\n    volumes:\n      - sockets:/sockets\n  api2:\n    image: ghcr.io/${REPO}:${SHA_SHORT}\n    command: [\"/app/server\", \"/sockets/api2.sock\", \"/index\"]\n    volumes:\n      - sockets:/sockets\n  nginx:\n    image: nginx:latest\n    ports:\n      - \"9999:9999\"\n    volumes:\n      - ./nginx.conf:/etc/nginx/nginx.conf:ro\n    depends_on:\n      - api1\n      - api2\n\nvolumes:\n  sockets:\n    driver: local\n    driver_opts:\n      type: tmpfs\n      device: tmpfs\n      o: size=4m,mode=0777\n" > docker-compose.yml

          if ! git diff --quiet; then
            git add docker-compose.yml
            git commit -m "chore: update docker-compose.yml with image tag ${SHA_SHORT}"
            git push origin submission
          else
            echo "No changes to commit"
          fi
