name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.SHA_SHORT }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA for Docker tag
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-submission:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout submission branch
        uses: actions/checkout@v4
        with:
          ref: submission
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update docker-compose.yml
        env:
          SHA_SHORT: ${{ needs.build-and-push.outputs.sha_short }}
          REPO: ${{ github.repository }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          cat <<EOF > docker-compose.yml
x-go: &go
  platform: linux/amd64
  restart: unless-stopped
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

services:
  lb:
    <<: *go
    image: ghcr.io/${REPO}:${SHA_SHORT}
    cpuset: "2,3"
    command: ["/lb", "9999", "/sockets/api1.sock", "/sockets/api2.sock"]
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "8MB"

  api1:
    <<: *go
    image: ghcr.io/${REPO}:${SHA_SHORT}
    cpuset: "0"
    command: ["/server", "/sockets/api1.sock", "/index"]
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "171MB"

  api2:
    <<: *go
    image: ghcr.io/${REPO}:${SHA_SHORT}
    cpuset: "1"
    command: ["/server", "/sockets/api2.sock", "/index"]
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "171MB"

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,mode=0777
EOF

          if ! git diff --quiet; then
            git add docker-compose.yml
            git commit -m "chore: update docker-compose.yml with image tag ${SHA_SHORT}"
            git push --force-with-lease origin submission
          else
            echo "No changes to commit"
          fi
