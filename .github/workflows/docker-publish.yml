name: Build and Push

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.sha.outputs.short }}

      - name: Update submission branch
        run: |
          SHORT="${{ steps.sha.outputs.short }}"
          IMAGE="ghcr.io/${{ github.repository }}:${SHORT}"
          git fetch origin submission || git checkout -b submission
          git checkout submission
          # Use a simple sed command to update the image tag in docker-compose.yml
          # We assume the image is specified in the docker-compose.yml file.
          # The image line in docker-compose.yml needs to be updated.
          # Note: The provided plan used a simple sed, but I should ensure it's robust.
          sed -i "s|image:.*|image: ${IMAGE}|g" docker-compose.yml
          git add docker-compose.yml
          git -c user.name="CI" -c user.email="ci@bot.dev" \
            commit -m "auto: update image to ${SHORT}" || true
          git push origin submission
