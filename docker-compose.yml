services:
  lb:
    image: ghcr.io/rlevidev/rinha-2026:80cc977
    command: ["/app/lb", "9999", "/sockets/api1.sock", "/sockets/api2.sock"]
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "8MB"

  api1:
    image: ghcr.io/rlevidev/rinha-2026:80cc977
    command: ["/app/server", "/sockets/api1.sock", "/index"]
    volumes:
      - sockets:/sockets
    healthcheck:
      test: ["CMD-SHELL", "test -S /sockets/api1.sock"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "171MB"

  api2:
    image: ghcr.io/rlevidev/rinha-2026:80cc977
    command: ["/app/server", "/sockets/api2.sock", "/index"]
    volumes:
      - sockets:/sockets
    healthcheck:
      test: ["CMD-SHELL", "test -S /sockets/api2.sock"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "171MB"

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,mode=0777
