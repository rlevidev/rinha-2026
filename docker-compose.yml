x-go: &go
  platform: linux/amd64
  restart: unless-stopped
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

services:
  lb:
    <<: *go
    build:
      context: .
      target: final
    cpuset: "2,3"
    command: ["/lb", "9999", "/sockets/api1.sock", "/sockets/api2.sock"]
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "8MB"

  api1:
    <<: *go
    build:
      context: .
      target: final
    cpuset: "0"
    command: ["/server", "/sockets/api1.sock", "/index"]
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "171MB"

  api2:
    <<: *go
    build:
      context: .
      target: final
    cpuset: "1"
    command: ["/server", "/sockets/api2.sock", "/index"]
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "171MB"

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,mode=0777
